<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>碎片收集</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="笔记导航">
        <div class="sidebar-nav">
          <button class="nav-item is-active" type="button" id="all-notes-button">
            <span aria-hidden="true">▶</span>
            <span>全部笔记</span>
          </button>
          <button class="nav-item" type="button" id="export-button">
            <span aria-hidden="true">↧</span>
            <span>导出 Excel</span>
          </button>
          <button class="nav-item" type="button" id="backup-button">
            <span aria-hidden="true">⇩</span>
            <span>导出备份</span>
          </button>
          <button class="nav-item" type="button" id="restore-button">
            <span aria-hidden="true">⇧</span>
            <span>导入备份</span>
          </button>
          <input class="file-input" type="file" id="restore-input" accept="application/json,.json">
        </div>

        <div class="tag-panel">
          <p class="sidebar-title">全部标签</p>
          <div class="tag-list" id="tag-list"></div>
        </div>
      </aside>

      <section class="main-panel" aria-label="碎片收集">
        <div class="workspace">
        <header class="brand-bar">
          <div class="brand-copy">
            <p class="brand-mark">Gin</p>
            <h1 class="brand-title">碎片收集</h1>
            <p class="brand-subtitle">我把散落的念头，种在这里</p>
          </div>
          <label class="search-box" for="search-input">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索内容">
          </label>
        </header>

        <div class="section-head">
          <div>
            <h2 id="view-label">全部笔记</h2>
            <p class="count-line" id="count-line">已收集 0 条</p>
          </div>
        </div>

        <form class="entry-form" id="entry-form">
          <input type="hidden" id="entry-id">
          <textarea id="entry-content" name="content" rows="4" placeholder="现在的想法是..."></textarea>
          <div class="composer-actions">
            <div class="form-actions">
              <button class="ghost-button" type="button" id="cancel-edit" hidden>取消</button>
              <button class="primary-button" type="submit" id="save-button">发送</button>
            </div>
          </div>
        </form>

        <div class="timeline" id="timeline"></div>
        <div class="manage-list" id="manage-list" hidden></div>
        <div class="empty-state" id="empty-state" hidden>
          <h3>还没有碎片</h3>
          <p>先写下一条信息，它会按时间出现在这里。</p>
        </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
